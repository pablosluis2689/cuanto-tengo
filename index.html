<div class=md id=mg><div class=sh><h3>🔒 ¿Articulo con garantía?</h3><p style=font-size:12px;color:#666>Te avisamos cuando se vaya a vencer, con o sin foto</p><input id=gt placeholder=Tienda><input id=gm type=number min=1 placeholder=Meses garantía><input id=gp placeholder=Producto><button class=bm onclick="sg2()">Si, guardar garantía</button><button class="bm sec" onclick="cg2()">No, solo gasto</button></div></div>

</div></div>
<script>
const N='cuantoTengoDB',S='tickets';function oD(){return new Promise(r=>{const q=indexedDB.open(N,1);q.onupgradeneeded=e=>e.target.result.createObjectStore(S,{keyPath:'id'});q.onsuccess=()=>r(q.result)})}async function gA(){const d=await oD();return new Promise(r=>{const t=d.transaction(S,'readonly');const q=t.objectStore(S).getAll();q.onsuccess=()=>r(q.result.sort((a,b)=>b.id-a.id))})}async function pT(t){const d=await oD();return new Promise(r=>{const x=d.transaction(S,'readwrite');x.objectStore(S).put(t);x.oncomplete=()=>r()})}async function dT(i){const d=await oD();return new Promise(r=>{const x=d.transaction(S,'readwrite');x.objectStore(S).delete(i);x.oncomplete=()=>r()})}
function compF(f){return new Promise(r=>{const i=new Image();i.src=URL.createObjectURL(f);i.onload=()=>{const c=document.createElement('canvas');let w=i.width,h=i.height;if(w>1200){h=h*(1200/w);w=1200}c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);r(c.toDataURL('image/jpeg',.75))}})}
let C=JSON.parse(localStorage.getItem('ct_config')||'null'),T=[],csel=C?C.ciclo:'mensual',tmp=null,editingId=null;let TB=parseFloat(localStorage.getItem('bcv_tasa')||'180');let FB=localStorage.getItem('bcv_fecha')||'offline';window._m=localStorage.getItem('moneda_pref')||'bs';const TD=new Date().toISOString().split('T')[0];
function fB(n){return 'Bs '+n.toLocaleString('es-VE',{minimumFractionDigits:2})}function fU(n){return '$ '+n.toLocaleString('en-US',{minimumFractionDigits:2})}
function sc(c,e){csel=c;document.querySelectorAll('.cd').forEach(b=>b.classList.remove('a'));e.classList.add('a')}function sm(m){window._m=m;localStorage.setItem('moneda_pref',m);cb.classList.toggle('a',m=='bs');cu.classList.toggle('a',m=='usd');R()}
function cs(){document.getElementById('s').classList.add('h')}
function so(){
  let l=parseFloat(li.value)||0;if(l<=0){li.classList.add('er');vm.style.display='block';vm.innerText='>0';return}
  let mm=lm.value;let b=mm=='usd'?l*TB:l;
  if(!C){C={ciclo:csel,limite:b,limiteOriginal:l,limiteMoneda:mm,inicio:Date.now(),historial:[]};}
  else{C.ciclo=csel;C.limite=b;C.limiteOriginal=l;C.limiteMoneda=mm;if(!C.historial)C.historial=[];}
  localStorage.setItem('ct_config',JSON.stringify(C));updatePostConfig();cs();L();
}
async function resetApp(){if(!confirm('¿Cerrar ciclo y empezar de 0?'))return;if(!confirm('Confirma de nuevo'))return;for(const x of [...T]){await dT(x.id);} T=[];localStorage.removeItem('ct_config');C=null;li.value='';updatePostConfig();document.getElementById('s').classList.remove('h');R();}
function updatePostConfig(){const el=document.getElementById('postConfig');const btn=document.getElementById('btnGuardarTope');if(C){el.style.display='block';btn.innerText='💾 Actualizar';}else{el.style.display='none';btn.innerText='💾 GUARDAR Y EMPEZAR CICLO';}}
(function initSplash(){if(C){document.getElementById('s').classList.add('h');li.value=C.limiteOriginal||'';lm.value=C.limiteMoneda||'bs';document.querySelectorAll('.cd').forEach(b=>b.classList.remove('a'));let e=document.getElementById('c-'+C.ciclo);if(e)e.classList.add('a');}updatePostConfig();})();
async function L(){T=await gA();fe.max=TD;R();ck();bT()}function ck(){if(!C)return;const d={diario:1,semanal:7,quincenal:15,mensual:30,anual:365}[C.ciclo]||30;const p=Math.floor((Date.now()-C.inicio)/86400000);pd.innerText=`Dia ${p} de ${d} • Tasa ${TB.toFixed(2)}`;if(p>=d&&confirm(`Ciclo ${C.ciclo} vencio ¿Cerrar?`)){const t=T.reduce((a,b)=>a+b.monto,0);if(!C.historial)C.historial=[];C.historial.push({ciclo:C.ciclo,limite:C.limite,gastado:t,cierre:Date.now()});for(const x of [...T]){await dT(x.id);} T=[]; C.inicio=Date.now();localStorage.setItem('ct_config',JSON.stringify(C));R();}}
async function bT(force=false){const u=()=>{br.innerText=TB.toFixed(2);brS.innerText=TB.toFixed(2);brC.innerText=TB.toFixed(2);bf.innerText=FB;bfS.innerText=FB;bfC.innerText=FB;R()};if(force){bf.innerText='actualizando...';bfS.innerText='...';bfC.innerText='...';}try{const r=await fetch('https://datos.cromstudio.com.ve/tasa');const j=await r.json();let us=j.tasas?.USD||j.USD;if(typeof us=='string')us=parseFloat(us.replace(',','.'));if(us&&us>10){TB=us;FB=j.fecha_valor||j.fecha||new Date().toLocaleDateString()}else throw 0}catch{try{const r2=await fetch('https://ve.dolarapi.com/v1/dolares/oficial');const j2=await r2.json();let us=j2.promedio||j2.price;if(us){TB=parseFloat(us);FB=j2.fechaActualizacion||new Date().toLocaleDateString()}}catch{}}localStorage.setItem('bcv_tasa',TB);localStorage.setItem('bcv_fecha',FB);u();}
function openCalc(){document.getElementById('mcalc').classList.add('a')}function closeCalc(){document.getElementById('mcalc').classList.remove('a')}function calcBD(){let v=parseFloat(calcIn.value);if(!v)return;calcRes.innerText=`${fB(v)} = ${fU(v/TB)}`}function calcDB(){let v=parseFloat(calcIn.value);if(!v)return;calcRes.innerText=`${fU(v)} = ${fB(v*TB)}`}
function openForm(){lf();fe.value=TD;fe.max=TD;mt.innerText=editingId?'Editar gasto':'Nuevo gasto';document.getElementById('btnSaveGasto').innerText=editingId?'💾 Actualizar gasto':'💾 Guardar gasto';mo.classList.add('a');}
function closeMo(){document.getElementById('mo').classList.remove('a');}
function closeMo2(){document.getElementById('mo').classList.remove('a');editingId=null;tmp=null;lf2();}
function lf(){if(editingId) return;}
function lf2(){document.getElementById('cm').value='';mn.value='';mm.value='bs';fe.value='';fn.value='';gt.value='';gm.value='';gp.value='';pv.style.display='none';fnFoto.style.display='none';window._im=null;me.style.display='none';fe2.style.display='none';cp.innerText='';ff.value='';}
mn.oninput=()=>{let v=parseFloat(mn.value);if(isNaN(v)||v<=0){me.style.display='block';return}me.style.display='none';let m=mm.value;let bs=m=='usd'?v*TB:v;let us=m=='usd'?v:v/TB;cp.innerText=m=='usd'?`= ${fB(bs)}`:`= ${fU(us)}`};mm.onchange=()=>mn.oninput();
fe.onchange=()=>{if(fe.value>TD){fe.value=TD;fe2.style.display='block';setTimeout(()=>fe2.style.display='none',1500);}}
ff.onchange=async e=>{const f=e.target.files[0];if(!f)return;const c=await compF(f);pv.src=c;pv.style.display='block';fnFoto.style.display='block';window._im=c;};
function editGasto(id){
  const t=T.find(x=>x.id==id); if(!t)return;
  editingId=id;
  document.getElementById('cm').value=t.comercio=='Compra'?'':t.comercio; mn.value=t.montoOriginal; mm.value=t.montoMoneda||'bs'; fe.value=t.fecha; fn.value=t.facturaNro||''; ct.value=t.categoria||'Otro';
  window._im=t.imagen||null;
  if(window._im){pv.src=window._im; pv.style.display='block'; fnFoto.style.display='block';}
  else{pv.style.display='none'; fnFoto.style.display='none';}
  mn.oninput();
  mt.innerText='Editar gasto';document.getElementById('btnSaveGasto').innerText='💾 Actualizar gasto';fe.max=TD;mo.classList.add('a');
}
function cg2(){
  mg.classList.remove('a');
  if(tmp){
    if(editingId) tmp.id=editingId;
    pT(tmp).then(()=>{const idx=T.findIndex(x=>x.id==tmp.id); if(idx>=0)T[idx]=tmp; else T.unshift(tmp); R(); editingId=null; tmp=null; lf2();});
  } else {editingId=null; tmp=null;}
}
async function sg2(){
  const m=Math.max(1,parseInt(gm.value)||0);if(m<=0)return;
  tmp.esGarantia=true;tmp.tienda=gt.value;tmp.producto=gp.value||tmp.comercio;tmp.mesesGarantia=m;
  const fr=new Date(tmp.fecha);fr.setMonth(fr.getMonth()+m);tmp.vence=fr.toISOString().slice(0,10);
  if(editingId) tmp.id=editingId;
  await pT(tmp);
  const idx=T.findIndex(x=>x.id==tmp.id);
  if(idx>=0) T[idx]=tmp; else T.unshift(tmp);
  mg.classList.remove('a');R();editingId=null;tmp=null;lf2();
}
async function sg(){
  let v=parseFloat(mn.value);if(isNaN(v)||v<=0){me.style.display='block';return}
  if(!fe.value){alert('Fecha');return}if(fe.value>TD)fe.value=TD;
  let moN=mm.value;let b=moN=='usd'?v*TB:v;let u=moN=='usd'?v:v/TB;
  tmp={
    comercio:(document.getElementById('cm').value||'').trim()||'Compra',monto:b,montoOriginal:v,montoMoneda:moN,tasaBCV:TB,montoUsd:u,
    fecha:fe.value,imagen:window._im||'',id:editingId||Date.now(),facturaNro:fn.value,categoria:ct.value,esGarantia:false
  };
  closeMo();
  mg.classList.add('a');
  gt.value=tmp.comercio;
}
function cL(){const t=T.reduce((a,b)=>a+b.monto,0);if(C&&t>=C.limite){at.innerText='¡LIMITE!';ax.innerText=`Llevas ${fB(t)} de ${fB(C.limite)}`;al.style.display='flex'}}
function fltr(f,e){document.querySelectorAll('.ch').forEach(c=>c.classList.remove('a'));e.classList.add('a');window._f=f;R()}
async function bT2(id){if(!confirm('¿Borrar?'))return;await dT(id);T=T.filter(t=>t.id!=id);R();}
function R(){
  if(!C){hs.innerText='Sin ciclo';ls.innerHTML=`<div style=text-align:center;padding:40px;color:#b8a98a>📒 Configura tope</div>`;return}
  hs.innerText=`${C.ciclo} • ${C.limiteMoneda=='usd'?fU(C.limiteOriginal):fB(C.limite)}`;
  db.innerText=`${T.length} tickets • ${TB.toFixed(2)}`;
  let tB=T.reduce((a,b)=>a+b.monto,0);
  let tU=T.reduce((a,b)=>a+(b.montoUsd||b.monto/(b.tasaBCV||TB)),0);
  let us=window._m=='usd';let p=Math.min(100,Math.round(tB/C.limite*100));
  pf.style.width=p+'%';pf.className='fl'+(p>=100?' d':p>=80?' w':'');
  pl.innerText=`${C.ciclo.toUpperCase()} ${p}%`;pn.innerText=us?`${fU(tU)} / ${fU(C.limite/TB)}`:`${fB(tB)} / ${fB(C.limite)}`;
  pr.innerText=tB>=C.limite?`Excedido ${fB(tB-C.limite)}`:`Quedan ${fB(C.limite-tB)} | ${fU((C.limite-tB)/TB)}`;
  tc.innerHTML=us?`${fU(tU)}<br><small style=font-size:11px;opacity:.6>${fB(tB)}</small>`:`${fB(tB)}<br><small style=font-size:11px;opacity:.6>${fU(tU)}</small>`;
  let qB=C.limite-tB;qc.innerHTML=us?`${fU(qB/TB)}<br><small style=font-size:11px;opacity:.6>${fB(qB)}</small>`:`${fB(qB)}<br><small style=font-size:11px;opacity:.6>${fU(qB/TB)}</small>`;
  ll.innerText=us?'$':'Bs';lq.innerText=us?'$':'Bs';sl.innerText=us?fB(tB):fU(tU);sq.innerText=us?fB(qB):fU(qB/TB);
  let D=T;if(window._f=='garantias')D=D.filter(t=>t.esGarantia);
  ls.innerHTML=D.length?'':`<div style=text-align:center;padding:40px;color:#b8a98a>📒 Vacío</div>`;
  D.forEach(t=>{
    const d=document.createElement('div');d.className='tk';
    const u=t.montoUsd||t.monto/(t.tasaBCV||TB);
    let venc='';if(t.esGarantia&&t.vence){let dv=new Date(t.vence);let diff=Math.ceil((dv-new Date())/86400000);venc=diff<0?`<small style=color:#e63946>⚠️ Vencida</small>`:diff<30?`<small style=color:#ffb703>⏳ ${diff}d</small>`:`<small style=color:#16b84a>🔒 ${t.vence}</small>`;}
    d.innerHTML=`<img src="${t.imagen||''}"><div style=flex:1><b>${t.comercio} ${t.esGarantia?'🔒':''}</b><br><small>${t.fecha} • ${t.categoria}</small><br><small style=color:#0d5a2a;font-weight:800>${fB(t.monto)} = ${fU(u)}</small><br>${venc}</div>
    <div style=display:flex;flex-direction:column;gap:6px;align-items:center><b style=color:#16b84a;font-size:12px>${window._m=='usd'?fU(u):fB(t.monto)}</b>
    <div style=display:flex;gap:6px><button class=ed onclick="editGasto(${t.id})">✏️</button><button class=xd onclick="bT2(${t.id})">×</button></div></div>`;
    ls.appendChild(d)
  })
}
sm(window._m);L();
</script></body></html>
